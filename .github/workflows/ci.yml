name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  typos:
    name: Spell & Typo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for spelling typos
        uses: crate-ci/typos@v1
        with:
          config: _typos.toml

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'tests/**'
            python:
              - 'wall/**'
              - 'scripts/**'
              - 'spikes/**'

  web-quality:
    name: Web Syntax & Engine Quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js web/engine/*.js tests/probe/*.mjs tests/unit/*.mjs tests/unit/engine/*.mjs; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done

      - name: Verify zero-hardcode grep gate
        run: |
          if grep -rnE "antu_2|gaoxiong_7|benningdun" web/engine/; then
            echo "FAIL: Per-skin hardcodes detected in web/engine/!"
            exit 1
          else
            echo "PASS: Zero per-skin hardcodes in web/engine/"
          fi

      - name: Run fast engine unit tests
        run: node --test "tests/unit/**/*.test.mjs" "tests/unit/*.test.mjs"

  python-quality:
    name: Python Compilation & Syntax
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile check Python scripts
        run: |
          python3 -m py_compile wall/*.py scripts/*.py spikes/s2-mirror/*.py
