<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mizu-l2d</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; }

    /* L2D interaction tips toggle — glassy magnifier like the game's button,
       kept faint when idle so it never competes with the scene */
    #tips-toggle {
      position: fixed; right: 14px; bottom: 14px; width: 40px; height: 40px;
      padding: 0; border: 0; background: none; cursor: pointer; z-index: 10;
      opacity: .4; transition: opacity .15s ease;
    }
    #tips-toggle:hover, #tips-toggle:focus-visible { opacity: 1; }
    #tips-toggle .lens { fill: rgba(18, 28, 42, .5); stroke: rgba(255, 255, 255, .85); stroke-width: 1.6; }
    #tips-toggle .lens-text { fill: #fff; font: 700 9px system-ui, sans-serif; text-anchor: middle; }
    #tips-toggle .handle { stroke: rgba(255, 255, 255, .85); stroke-width: 2.6; stroke-linecap: round; }
    #tips-toggle.on { opacity: 1; }
    #tips-toggle.on .lens { fill: rgba(40, 62, 92, .78); stroke: #fff; }

    /* placement reset (R1a.5): sits left of the tips toggle, shown only while
       the pointer is over the page so the scene stays clean */
    #view-reset {
      position: fixed; right: 60px; bottom: 14px; width: 40px; height: 40px;
      padding: 0; border: 0; background: none; cursor: pointer; z-index: 10;
      opacity: 0; transition: opacity .15s ease;
    }
    body:hover #view-reset { opacity: .4; }
    #view-reset:hover, #view-reset:focus-visible { opacity: 1; }
    #view-reset .lens { fill: rgba(18, 28, 42, .5); stroke: rgba(255, 255, 255, .85); stroke-width: 1.6; }
    #view-reset .arrow { fill: none; stroke: rgba(255, 255, 255, .9); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* model picker (R1c.2): glass panel top-right, same language as the tips */
    .picker-open {
      position: fixed; right: 14px; top: 14px; width: 40px; height: 40px;
      padding: 0; border: 0; background: none; cursor: pointer; z-index: 10;
      opacity: .4; transition: opacity .15s ease;
    }
    .picker-open:hover, .picker-open:focus-visible, .picker-open[aria-expanded="true"] { opacity: 1; }
    .picker-open .lens { fill: rgba(18, 28, 42, .5); stroke: rgba(255, 255, 255, .85); stroke-width: 1.6; }
    .picker-open .bar { stroke: rgba(255, 255, 255, .9); stroke-width: 1.8; stroke-linecap: round; }
    .picker-panel {
      position: fixed; right: 14px; top: 62px; z-index: 12; width: 340px;
      max-height: calc(100vh - 92px); display: flex; flex-direction: column;
      background: rgba(255, 255, 255, .6); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .6); border-radius: 14px;
      box-shadow: 0 6px 24px rgba(30, 42, 60, .2);
      color: #2e3d52; font: 13px/1.4 system-ui, sans-serif;
    }
    .picker-panel[hidden] { display: none; }
    .picker-head { display: flex; gap: 6px; padding: 10px 10px 6px; }
    .picker-search {
      flex: 1; min-width: 0; padding: 6px 10px; border-radius: 9px; font: inherit;
      border: 1px solid rgba(70, 88, 110, .25); background: rgba(255, 255, 255, .7); color: inherit;
    }
    .picker-chip {
      padding: 6px 10px; border-radius: 9px; font: inherit; cursor: pointer;
      border: 1px solid rgba(70, 88, 110, .25); background: rgba(255, 255, 255, .5); color: inherit;
    }
    .picker-chip.on { background: rgba(40, 62, 92, .8); color: #fff; border-color: transparent; }
    .picker-count { padding: 0 12px 6px; font-size: 11px; color: #5d6d82; }
    .picker-list { overflow-y: auto; padding: 0 6px 8px; }
    .picker-ship {
      display: flex; align-items: baseline; gap: 6px; width: 100%; padding: 6px 8px;
      border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left;
      font: inherit; color: inherit;
    }
    .picker-ship:hover { background: rgba(255, 255, 255, .55); }
    .picker-ship::before { content: '▸'; color: #5d6d82; width: 10px; }
    .picker-ship.open::before { content: '▾'; }
    .picker-ship-en { font-weight: 600; }
    .picker-ship-sub { color: #6b7a8e; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .picker-ship-n { margin-left: auto; color: #6b7a8e; font-size: 11px; }
    .picker-skin {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 24px; border-radius: 8px;
    }
    .picker-skin:hover { background: rgba(255, 255, 255, .45); }
    .picker-skin.current { background: rgba(40, 62, 92, .12); }
    .picker-skin-label {
      flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start;
      padding: 2px 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    }
    .picker-skin-label:disabled { cursor: default; opacity: .55; }
    .picker-skin-en { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .picker-skin-sub { color: #6b7a8e; font-size: 11px; }
    .picker-dl {
      padding: 3px 9px; border-radius: 7px; font: inherit; font-size: 12px; cursor: pointer;
      border: 1px solid rgba(70, 88, 110, .35); background: rgba(255, 255, 255, .7); color: inherit;
    }
    .picker-status { font-size: 11px; color: #5d6d82; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* hover label — same glass speech-bubble language as the pinned badges */
    #tips-label {
      position: fixed; z-index: 11; pointer-events: none;
      transform: translate(12px, 14px);
      background: rgba(255, 255, 255, .5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .55);
      color: #46586e;
      font: 12px/1.4 system-ui, sans-serif; padding: 3px 10px; border-radius: 10px;
      box-shadow: 0 2px 10px rgba(30, 42, 60, .18);
    }
  </style>
</head>
<body>
  <button id="tips-toggle" type="button" aria-pressed="false" title="L2D interaction tips" hidden>
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <circle class="lens" cx="17.5" cy="17.5" r="12.5"></circle>
      <text class="lens-text" x="17.5" y="20.5">L2D</text>
      <line class="handle" x1="27" y1="27" x2="33.5" y2="33.5"></line>
    </svg>
  </button>
  <button id="view-reset" type="button" title="Reset placement">
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <circle class="lens" cx="20" cy="20" r="12.5"></circle>
      <path class="arrow" d="M 25.5 17.5 A 6 6 0 1 0 20.4 26"></path>
      <polyline class="arrow" points="22.5,14.2 25.8,17.6 29,15"></polyline>
    </svg>
  </button>
  <div id="tips-label" hidden></div>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/live2dcubismcore.min.js"></script>
  <script src="vendor/pixi-live2d-display.min.js"></script>
  <script src="picker.js"></script>
  <script src="main.js"></script>
</body>
</html>
