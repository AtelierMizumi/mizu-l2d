# mizu-l2d configuration
# Loaded from ~/.config/mizu-l2d/config.toml ($XDG_CONFIG_HOME/mizu-l2d/config.toml).
# Missing keys fall back to defaults.

schema = 1

[wall]
# Default Live2D model prefab to load on startup (e.g. "gaoxiong_7", "rangbaer_4").
model = "gaoxiong_7"

# Connectors to draw on. Omit or comment out to draw on all connected outputs.
# outputs = ["eDP-1"]
